<h1>$heading</h1>

$errors

<form class="form" method="post" action="$action">

    <label for="title">Title</label>
    <input type="text" id="title" name="title" maxlength="100" required
           placeholder="Help edit a 30-second founder reel" value="$title">

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="6" required
              placeholder="What do you need, by when, and is it paid or a peer exchange?">$description</textarea>

    <label for="display_name">Display name</label>
    <input type="text" id="display_name" name="display_name" required value="$display_name">

    <div class="row">
        <div>
            <label for="skill">Skill</label>
            <select id="skill" name="skill" required>
                <option value="">Choose a skill</option>
                $skill_options
            </select>
        </div>
        <div>
            <label for="status">Status</label>
            <select id="status" name="status">
                $status_options
            </select>
        </div>
    </div>

    <label for="content_link">Content link (optional)</label>
    <input type="url" id="content_link" name="content_link" placeholder="https://..." value="$content_link">

    <div class="actions">
        <button class="button" type="submit">$button_text</button>
        <a href="$cancel_url">Cancel</a>
    </div>
    <p class="form-note">When you post or save, your browser will ask for the shared board password.</p>
</form>
