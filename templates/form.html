<h1>$heading</h1>

$errors

<form class="form" method="post" action="$action">
    $csrf_input

    <label for="title">Title</label>
    <input type="text" id="title" name="title" maxlength="100" required value="$title">

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="6" required>$description</textarea>

    <p>Your account name will appear on this request.</p>

    <div class="row">
        <div>
            <label for="skill">Skill</label>
            <select id="skill" name="skill" required>
                <option value="">Choose a skill</option>
                $skill_options
            </select>
        </div>
        <div>
            <label for="status">Status</label>
            <select id="status" name="status">
                $status_options
            </select>
        </div>
    </div>

    <label for="content_link">Content link (optional)</label>
    <input type="url" id="content_link" name="content_link" value="$content_link">

    <div class="actions">
        <button class="button" type="submit">$button_text</button>
        <a href="$cancel_url">Cancel</a>
    </div>
    <p class="form-note">Only your account can edit or delete this request.</p>
</form>
