<li class="card testimonial-card $card_class">
    <div class="card-meta">
        <span class="tag">$skill</span>
        <span class="status $status_class">$status</span>
    </div>
    <span class="quote-mark" aria-hidden="true">“</span>
    <h2><a href="/requests/$id">$title</a></h2>
    <p class="request-quote">$description_preview</p>
    <div class="card-byline">
        <span class="author-mark" aria-hidden="true">$author_initial</span>
        <p class="by">By <strong>$display_name</strong></p>
        <a class="card-arrow" href="/requests/$id" aria-label="Open request: $title"><span>Open request</span><span aria-hidden="true">→</span></a>
    </div>
</li>
