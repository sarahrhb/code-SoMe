<li class="card $done">
    <div class="card-top">
        <span class="tag">$skill</span>
        <span class="status $status_css">$status</span>
    </div>
    <span class="quote-mark" aria-hidden="true">“</span>
    <h2><a href="/requests/$id">$title</a></h2>
    <p class="card-text">$preview</p>
    <div class="card-bottom">
        <span class="initial" aria-hidden="true">$initial</span>
        <p class="by">By <strong>$display_name</strong></p>
        <a class="card-link" href="/requests/$id" aria-label="Open request: $title"><span>Open request</span><span aria-hidden="true">→</span></a>
    </div>
</li>
