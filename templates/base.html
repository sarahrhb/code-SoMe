<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CODE Creator Board{% endblock %} | CODE Creator Board</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="{{ url_for('list_requests') }}">CODE Creator Board</a>
        <nav>
            <a href="{{ url_for('list_requests') }}">Requests</a>
            <a href="{{ url_for('new_request') }}">Ask for help</a>
            <a href="{{ url_for('about') }}">About</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Student project for Web Tech. Not an official CODE service. All names are fictional.</p>
    </footer>
</body>
</html>
