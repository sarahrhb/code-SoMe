<p><a href="/requests">&larr; Back to all requests</a></p>

<article class="detail">
    <span class="tag">$skill</span>
    <span class="status $status_class">$status</span>
    <h1>$title</h1>
    <p class="by">Asked by $display_name &middot; Request #$id</p>

    <p class="description">$description</p>

    $link

    <div class="actions">
        <a class="button" href="/requests/$id/edit">Edit</a>
        <a class="button button-danger" href="/requests/$id/delete">Delete</a>
    </div>
</article>
