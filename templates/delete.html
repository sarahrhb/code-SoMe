<div class="confirm">
    <h1>Delete this request?</h1>
    <p>You are about to permanently delete <strong>“$title”</strong>. Its request and related updates will be removed.</p>
    <form method="post" action="/requests/$id/delete">
        $csrf_input
        <div class="actions">
            <button class="button button-danger" type="submit">Yes, delete it</button>
            <a href="/requests/$id">Keep this request</a>
        </div>
    </form>
</div>
